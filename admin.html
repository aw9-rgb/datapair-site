<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>DataPair — Admin</title>
<link rel="icon" href="/favicon.png">
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#FAFBFD;color:#071839}
  .wrap{max-width:1000px;margin:0 auto;padding:28px 20px}
  h1{font-size:1.5rem;margin:0 0 20px}
  h2.sec{font-size:1.15rem;margin:30px 0 12px}
  form{display:flex;gap:10px;margin-bottom:24px}
  input{font:inherit;padding:10px 12px;border:1.5px solid #AEB9C4;border-radius:5px;flex:1;max-width:320px}
  button{font:inherit;font-weight:600;background:#004EBC;color:#fff;border:0;border-radius:5px;padding:10px 18px;cursor:pointer}
  button.link{background:none;color:#004EBC;padding:0;text-decoration:underline;font-weight:500}
  .card{background:#fff;border:1.5px solid #D3DAE6;border-radius:6px;padding:18px 20px;margin-bottom:14px}
  .card h3{font-size:1.1rem;margin:0 0 4px}
  .meta{color:#46536B;font-size:.92rem;margin-bottom:10px}
  .badge{display:inline-block;font-size:.8rem;font-weight:700;border-radius:12px;padding:2px 10px;margin-left:8px;vertical-align:middle}
  .badge.yes{background:#F0FCF8;color:#019C86;border:1px solid #01D7A7}
  .badge.no{background:#FFF7E8;color:#8A5A00;border:1px solid #F3C567}
  .desc{white-space:pre-wrap;margin:10px 0}
  details summary{cursor:pointer;color:#004EBC;font-weight:600;margin-top:6px}
  dl{display:grid;grid-template-columns:minmax(160px,320px) 1fr;gap:6px 14px;margin:10px 0 0;font-size:.95rem}
  dt{color:#46536B} dd{margin:0}
  table{width:100%;border-collapse:collapse;background:#fff;border:1.5px solid #D3DAE6;border-radius:6px;font-size:.95rem}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #D3DAE6;vertical-align:top}
  th{color:#46536B;font-weight:600}
  .err{color:#B42318}
</style>
</head>
<body>
<div class="wrap">
  <h1>DataPair admin</h1>
  <form id="f"><input id="k" type="password" placeholder="Admin password" autocomplete="current-password"><button>Show</button></form>
  <p id="msg"></p>
  <div id="out"></div>
</div>
<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const k = document.getElementById('k');
try { k.value = sessionStorage.getItem('dpk') || ''; } catch {}
async function pdf(id, name, kind){
  const r = await fetch('/api/submissions?' + (kind || 'pdf') + '=' + encodeURIComponent(id), { headers: { 'x-admin-key': k.value } });
  if (!r.ok) return alert('Could not load that PDF.');
  const url = URL.createObjectURL(await r.blob());
  const a = Object.assign(document.createElement('a'), { href: url, download: name || 'DataPair Agreement.pdf' }); a.click();
}
async function load(){
  const msg = document.getElementById('msg'); msg.textContent = 'Loading…'; msg.className='';
  const r = await fetch('/api/submissions', { headers: { 'x-admin-key': k.value } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { msg.textContent = j.error || 'Could not load.'; msg.className='err'; return; }
  try { sessionStorage.setItem('dpk', k.value); } catch {}
  const sigs = j.signatures || [], byIntake = Object.fromEntries(sigs.filter(s => s.intakeId).map(s => [s.intakeId, s]));
  msg.textContent = `${j.items.length} intake${j.items.length === 1 ? '' : 's'} · ${sigs.length} signed agreement${sigs.length === 1 ? '' : 's'}`;
  const sigTable = sigs.length ? `<h2 class="sec">Signed agreements</h2><table><thead><tr><th>Company</th><th>Signer</th><th>Signed</th><th></th></tr></thead><tbody>` +
    sigs.map(s => `<tr><td>${esc(s.company)}</td><td>${esc(s.name)}, ${esc(s.title)}<br><a href="mailto:${esc(s.email)}">${esc(s.email)}</a></td>
      <td>${new Date(s.signedAt).toLocaleString()}<br><small>IP ${esc(s.ip)} · v${esc(s.version)}</small></td>
      <td><button class="link" onclick="pdf('${esc(s.id)}','DataPair Agreement - ${esc(s.company).replace(/'/g,'')}.pdf')">Agreement</button><br>
        <button class="link" onclick="pdf('${esc(s.id)}','Letter of Authorization - ${esc(s.company).replace(/'/g,'')}.pdf','loa')">Letter of Authorization</button></td></tr>`).join('') + `</tbody></table>` : '';
  const cards = j.items.map(x => {
    const s = byIntake[x.id];
    const badge = x.type === 'seller-v2' ? (s ? '<span class="badge yes">Signed</span>' : '<span class="badge no">Not signed yet</span>') : '';
    const head = `<h3>${esc(x.company)} — ${esc(x.name)}${badge}</h3>
      <div class="meta">${new Date(x.createdAt).toLocaleString()} · ${esc(x.industry)}${x.employees ? ' · ' + esc(x.employees) + ' full-time employees' : ''}</div>`;
    if (x.type === 'seller-v2') return `<div class="card">${head}
      <dl><dt>Email</dt><dd><a href="mailto:${esc(x.email)}">${esc(x.email)}</a></dd><dt>Phone</dt><dd>${esc(x.phone) || '—'}</dd></dl>
      <details><summary>All answers</summary><dl>${(x.summary || []).map(([q, a]) => `<dt>${esc(q)}</dt><dd>${esc(a)}</dd>`).join('')}</dl></details></div>`;
    return `<div class="card">${head}<div class="desc">${esc(x.description)}</div>
      <dl><dt>Email</dt><dd><a href="mailto:${esc(x.email)}">${esc(x.email)}</a></dd><dt>Phone</dt><dd>${esc(x.phone) || '—'}</dd>
      <dt>Personal info</dt><dd>${esc(x.personal)}</dd><dt>Owns data</dt><dd>${esc(x.ownership)}</dd><dt>Heard via</dt><dd>${esc(x.source) || '—'}</dd></dl></div>`;
  }).join('');
  document.getElementById('out').innerHTML = sigTable + `<h2 class="sec">Intakes</h2>` + (cards || '<p>No intakes yet.</p>');
}
document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); load(); });
if (k.value) load();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>DataPair — Intake submissions</title>
<link rel="icon" href="/favicon.png">
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#FAFBFD;color:#071839}
  .wrap{max-width:1000px;margin:0 auto;padding:28px 20px}
  h1{font-size:1.5rem;margin:0 0 20px}
  form{display:flex;gap:10px;margin-bottom:24px}
  input{font:inherit;padding:10px 12px;border:1.5px solid #AEB9C4;border-radius:5px;flex:1;max-width:320px}
  button{font:inherit;font-weight:600;background:#004EBC;color:#fff;border:0;border-radius:5px;padding:10px 18px;cursor:pointer}
  .card{background:#fff;border:1.5px solid #D3DAE6;border-radius:6px;padding:18px 20px;margin-bottom:14px}
  .card h2{font-size:1.1rem;margin:0 0 4px}
  .meta{color:#46536B;font-size:.92rem;margin-bottom:10px}
  .desc{white-space:pre-wrap;margin:10px 0}
  dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:0;font-size:.95rem}
  dt{color:#46536B}
  .err{color:#B42318}
</style>
</head>
<body>
<div class="wrap">
  <h1>Intake submissions</h1>
  <form id="f"><input id="k" type="password" placeholder="Admin password" autocomplete="current-password"><button>Show submissions</button></form>
  <p id="msg"></p>
  <div id="list"></div>
</div>
<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const k = document.getElementById('k');
try { k.value = sessionStorage.getItem('dpk') || ''; } catch {}
async function load(){
  const msg = document.getElementById('msg'); msg.textContent = 'Loading…'; msg.className='';
  const r = await fetch('/api/submissions', { headers: { 'x-admin-key': k.value } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { msg.textContent = j.error || 'Could not load.'; msg.className='err'; return; }
  try { sessionStorage.setItem('dpk', k.value); } catch {}
  msg.textContent = j.items.length ? `${j.items.length} submission${j.items.length>1?'s':''}` : 'No submissions yet.';
  document.getElementById('list').innerHTML = j.items.map(x => `
    <div class="card">
      <h2>${esc(x.company)} — ${esc(x.name)}</h2>
      <div class="meta">${new Date(x.createdAt).toLocaleString()} · ${esc(x.industry)} · ${esc(x.span)}</div>
      <div class="desc">${esc(x.description)}</div>
      <dl>
        <dt>Email</dt><dd><a href="mailto:${esc(x.email)}">${esc(x.email)}</a></dd>
        <dt>Phone</dt><dd>${esc(x.phone) || '—'}</dd>
        <dt>Personal info</dt><dd>${esc(x.personal)}</dd>
        <dt>Owns data</dt><dd>${esc(x.ownership)}</dd>
        <dt>Heard via</dt><dd>${esc(x.source) || '—'}</dd>
      </dl>
    </div>`).join('');
}
document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); load(); });
if (k.value) load();
</script>
</body>
</html>
